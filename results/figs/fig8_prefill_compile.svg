<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="prefill 整层编译的收益与边界"><title>prefill 整层编译的收益与边界</title><rect width="920" height="520" fill="#ffffff"/><rect x="0.0" y="0.0" width="920.0" height="520.0" fill="#ffffff" rx="0" stroke="none" stroke-width="1"/><text x="30.0" y="40.0" font-size="20" fill="#1e293b" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" letter-spacing="-0.3">prefill 整层编译：把 CPU 提交砍一半，但只对短 prompt 兑现</text><text x="30.0" y="64.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">Qwen3-0.6B · RTX 4070 Laptop 8GB · 每根柱都是 5 次重复的中位数</text><text x="30.0" y="106.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">① CPU 提交时长（ms）：一层的 336 次 launch 被压成一张图</text><line x1="60.0" y1="340.0" x2="460.0" y2="340.0" stroke="#e2e8f0" stroke-width="1"/><text x="52.0" y="344.0" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">0</text><line x1="60.0" y1="290.9" x2="460.0" y2="290.9" stroke="#e2e8f0" stroke-width="1"/><text x="52.0" y="294.9" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">10</text><line x1="60.0" y1="241.8" x2="460.0" y2="241.8" stroke="#e2e8f0" stroke-width="1"/><text x="52.0" y="245.8" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">20</text><line x1="60.0" y1="192.7" x2="460.0" y2="192.7" stroke="#e2e8f0" stroke-width="1"/><text x="52.0" y="196.7" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">30</text><line x1="60.0" y1="143.6" x2="460.0" y2="143.6" stroke="#e2e8f0" stroke-width="1"/><text x="52.0" y="147.6" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">40</text><line x1="60.0" y1="124.0" x2="60.0" y2="340.0" stroke="#cbd5e1" stroke-width="1"/><line x1="60.0" y1="340.0" x2="460.0" y2="340.0" stroke="#cbd5e1" stroke-width="1"/><text x="100.0" y="358.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">512</text><text x="265.0" y="358.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">2048</text><text x="430.0" y="358.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">3584</text><text x="460.0" y="374.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">prompt 长度 (token)</text><polyline points="100.0,151.8 265.0,153.6 430.0,171.4" fill="none" stroke="#475569" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100.0" cy="151.8" r="4" fill="#475569" stroke="#fff" stroke-width="2"/><circle cx="265.0" cy="153.6" r="4" fill="#475569" stroke="#fff" stroke-width="2"/><circle cx="430.0" cy="171.4" r="4" fill="#475569" stroke="#fff" stroke-width="2"/><text x="440.0" y="175.4" font-size="11" fill="#475569" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">34.3</text><polyline points="100.0,204.2 265.0,207.7 430.0,220.6" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100.0" cy="204.2" r="4" fill="#d97706" stroke="#fff" stroke-width="2"/><circle cx="265.0" cy="207.7" r="4" fill="#d97706" stroke="#fff" stroke-width="2"/><circle cx="430.0" cy="220.6" r="4" fill="#d97706" stroke="#fff" stroke-width="2"/><text x="440.0" y="224.6" font-size="11" fill="#d97706" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">24.3</text><polyline points="100.0,254.4 265.0,255.5 430.0,248.7" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100.0" cy="254.4" r="4" fill="#2563eb" stroke="#fff" stroke-width="2"/><circle cx="265.0" cy="255.5" r="4" fill="#2563eb" stroke="#fff" stroke-width="2"/><circle cx="430.0" cy="248.7" r="4" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="440.0" y="252.7" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">18.6</text><rect x="60.0" y="383.0" width="10.0" height="10.0" fill="#475569" rx="2" stroke="none" stroke-width="1"/><text x="75.0" y="392.0" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">eager（现状）</text><rect x="194.0" y="383.0" width="10.0" height="10.0" fill="#d97706" rx="2" stroke="none" stroke-width="1"/><text x="209.0" y="392.0" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">每层一个 region</text><rect x="328.0" y="383.0" width="10.0" height="10.0" fill="#2563eb" rx="2" stroke="none" stroke-width="1"/><text x="343.0" y="392.0" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">整模型一张图</text><text x="60.0" y="408.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">三条线都是平的 → 提交成本只与「层数 × 算子数」有关，与 token 数无关；</text><text x="60.0" y="424.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">整层编译消掉的是 169 次 region 入口与 336 次 Python 分发。</text><text x="500.0" y="106.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">② 端到端 TTFT（ms）：只在 CPU 主导区兑现</text><line x1="530.0" y1="340.0" x2="870.0" y2="340.0" stroke="#e2e8f0" stroke-width="1"/><text x="522.0" y="344.0" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">0</text><line x1="530.0" y1="276.5" x2="870.0" y2="276.5" stroke="#e2e8f0" stroke-width="1"/><text x="522.0" y="280.5" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">50</text><line x1="530.0" y1="212.9" x2="870.0" y2="212.9" stroke="#e2e8f0" stroke-width="1"/><text x="522.0" y="216.9" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">100</text><line x1="530.0" y1="149.4" x2="870.0" y2="149.4" stroke="#e2e8f0" stroke-width="1"/><text x="522.0" y="153.4" font-size="10" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">150</text><line x1="530.0" y1="124.0" x2="530.0" y2="340.0" stroke="#cbd5e1" stroke-width="1"/><line x1="530.0" y1="340.0" x2="870.0" y2="340.0" stroke="#cbd5e1" stroke-width="1"/><text x="572.5" y="360.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">512</text><rect x="534.5" y="292.9" width="24.0" height="47.1" fill="#475569" rx="3" stroke="none" stroke-width="1"/><text x="546.5" y="287.9" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">37</text><rect x="560.5" y="306.2" width="24.0" height="33.8" fill="#d97706" rx="3" stroke="none" stroke-width="1"/><text x="572.5" y="301.2" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">27</text><rect x="586.5" y="311.0" width="24.0" height="29.0" fill="#2563eb" rx="3" stroke="none" stroke-width="1"/><text x="598.5" y="306.0" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">23</text><text x="657.5" y="360.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">2048</text><rect x="619.5" y="238.0" width="24.0" height="102.0" fill="#475569" rx="3" stroke="none" stroke-width="1"/><text x="631.5" y="233.0" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">80</text><rect x="645.5" y="235.8" width="24.0" height="104.2" fill="#d97706" rx="3" stroke="none" stroke-width="1"/><text x="657.5" y="230.8" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">82</text><rect x="671.5" y="238.0" width="24.0" height="102.0" fill="#2563eb" rx="3" stroke="none" stroke-width="1"/><text x="683.5" y="233.0" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">80</text><text x="742.5" y="360.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">3584</text><rect x="704.5" y="144.5" width="24.0" height="195.5" fill="#475569" rx="3" stroke="none" stroke-width="1"/><text x="716.5" y="139.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">154</text><rect x="730.5" y="139.6" width="24.0" height="200.4" fill="#d97706" rx="3" stroke="none" stroke-width="1"/><text x="742.5" y="134.6" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">158</text><rect x="756.5" y="145.6" width="24.0" height="194.4" fill="#2563eb" rx="3" stroke="none" stroke-width="1"/><text x="768.5" y="140.6" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">153</text><text x="827.5" y="360.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">prefix</text><text x="827.5" y="373.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">命中</text><rect x="789.5" y="288.5" width="24.0" height="51.5" fill="#475569" rx="3" stroke="none" stroke-width="1"/><text x="801.5" y="283.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">40</text><rect x="815.5" y="302.1" width="24.0" height="37.9" fill="#d97706" rx="3" stroke="none" stroke-width="1"/><text x="827.5" y="297.1" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">30</text><rect x="841.5" y="310.7" width="24.0" height="29.3" fill="#2563eb" rx="3" stroke="none" stroke-width="1"/><text x="853.5" y="305.7" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">23</text><text x="530.0" y="396.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">512 与 prefix 命中掉下来，2048/3584 纹丝不动。</text><text x="530.0" y="412.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">那两档 GPU 本来就是瓶颈，省下的 CPU 时间藏在 GPU 后面。</text><rect x="30.0" y="448.0" width="860.0" height="58.0" fill="#dbeafe" rx="6" stroke="none" stroke-width="1"/><text x="44.0" y="472.0" font-size="11.5" fill="#1e40af" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">判定实验结果：2048 从 80.3 → 80.3 ms，完全没有变化 —— 「CPU/GPU 全程重叠」的假设被证实，引擎里没有隐藏的同步点。</text><text x="44.0" y="493.0" font-size="11.5" fill="#1e40af" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" opacity="0.85">于是长 prompt 的下一步只能是减少 GPU 的工作量（量化 / 更快的 kernel），压 CPU 已经压不出东西了。</text></svg>