<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 664" width="920" height="664" role="img" aria-label="prefill 提交开销的平线与逐层线性"><title>prefill 提交开销的平线与逐层线性</title><rect width="920" height="664" fill="#ffffff"/><rect x="0.0" y="0.0" width="920.0" height="664.0" fill="#ffffff" rx="0" stroke="none" stroke-width="1"/><text x="30.0" y="40.0" font-size="20" fill="#1e293b" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" letter-spacing="-0.3">prefill 的慢不在 GPU：提交开销是一条平线，且严格按层线性</text><text x="30.0" y="64.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">插桩在 run_model 外层分离 CPU 提交与 GPU 执行 · 虚线为最小二乘拟合</text><text x="30.0" y="108.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">A · 提交与 token 数无关（bs=1）</text><line x1="96.0" y1="326.0" x2="860.0" y2="326.0" stroke="#cbd5e1" stroke-width="1"/><text x="86.0" y="330.0" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">0</text><line x1="96.0" y1="281.2" x2="860.0" y2="281.2" stroke="#e2e8f0" stroke-width="1"/><text x="86.0" y="285.2" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">30</text><line x1="96.0" y1="236.5" x2="860.0" y2="236.5" stroke="#e2e8f0" stroke-width="1"/><text x="86.0" y="240.5" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">60</text><line x1="96.0" y1="191.7" x2="860.0" y2="191.7" stroke="#e2e8f0" stroke-width="1"/><text x="86.0" y="195.7" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">90</text><line x1="96.0" y1="146.9" x2="860.0" y2="146.9" stroke="#e2e8f0" stroke-width="1"/><text x="86.0" y="150.9" font-size="10.5" fill="#94a3b8" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">120</text><text x="86.0" y="116.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">ms</text><text x="860.0" y="116.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">prompt 长度（token）</text><path d="M 96.0,326.0 L 96.0,324.1 L 248.8,324.1 L 401.6,324.0 L 554.4,318.7 L 707.2,257.8 L 860.0,149.3 L 860.0,326.0 L 96.0,326.0 Z" fill="#fef3c7" opacity="0.5"/><polyline points="96.0,324.1 248.8,324.1 401.6,324.0 554.4,318.7 707.2,257.8 860.0,149.3" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="96.0,281.4 248.8,281.7 401.6,282.4 554.4,279.7 707.2,279.7 860.0,284.7" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="96.0" y1="281.4" x2="860.0" y2="281.4" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/><circle cx="96.0" cy="324.1" r="3.6" fill="#d97706" stroke="#fff" stroke-width="2"/><circle cx="96.0" cy="281.4" r="3.6" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="96.0" y="344.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">16</text><circle cx="248.8" cy="324.1" r="3.6" fill="#d97706" stroke="#fff" stroke-width="2"/><circle cx="248.8" cy="281.7" r="3.6" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="248.8" y="344.0" font-size="10.5" fill="#64748b" te