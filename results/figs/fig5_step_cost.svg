<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 552" width="920" height="552" role="img" aria-label="decode 一步的耗时构成与三个优化攻击面"><title>decode 一步的耗时构成与三个优化攻击面</title><rect width="920" height="552" fill="#ffffff"/><rect x="0.0" y="0.0" width="920.0" height="552.0" fill="#ffffff" rx="0" stroke="none" stroke-width="1"/><text x="30.0" y="40.0" font-size="20" fill="#1e293b" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" letter-spacing="-0.3">decode 一步 6.69 ms，94% 的时间在等显存</text><text x="30.0" y="64.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">Qwen3-0.6B · RTX 4070 Laptop 8GB · 有效带宽 188 GB/s（峰值的 73%）· bs=1 · 走 CUDA graph</text><text x="30.0" y="108.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">① 一步的墙钟怎么花掉</text><text x="890.0" y="108.0" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">总 6.69 ms</text><rect x="30.0" y="122.0" width="813.7" height="34.0" fill="#2563eb" rx="4" stroke="none" stroke-width="1"/><rect x="845.2" y="122.0" width="44.8" height="34.0" fill="#d97706" rx="4" stroke="none" stroke-width="1"/><text x="44.0" y="144.0" font-size="12.5" fill="#fff" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">读 1.19 GB 权重  →  6.33 ms</text><text x="829.7" y="144.0" font-size="12.5" fill="#fff" text-anchor="end" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">94.6%</text><rect x="30.0" y="166.0" width="9.0" height="9.0" fill="#d97706" rx="2" stroke="none" stroke-width="1"/><text x="45.0" y="174.0" font-size="10.5" fill="#d97706" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">KV 读取 + 框架杂项：0.36 ms（5.4%）—— 单流时可忽略，高并发时才变成主角</text><text x="30.0" y="198.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">有效带宽 188 GB/s 由 C=1 与 C=64 两组独立实测反推出同一个常数，说明瓶颈不是算力、是显存搬运。</text><text x="30.0" y="232.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">② 这 1.19 GB 分三段，决定了量化该先砍哪里</text><text x="890.0" y="232.0" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">每步都完整读一遍</text><rect x="30.0" y="246.0" width="381.0" height="44.0" fill="#93c5fd" rx="4" stroke="none" stroke-width="1"/><text x="44.0" y="266.0" font-size="12.5" fill="#1e40af" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">MLP  0.53 GB</text><text x="44.0" y="282.0" font-size="10.5" fill="#1e40af" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" opacity="0.85">264M 参数 · 44%</text><rect x="413.0" y="246.0" width="250.9" height="44.0" fill="#fcd34d" rx="4" stroke="none" stroke-width="1"/><text x="427.0" y="266.0" font-size="12.5" fill="#92400e" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">Attention  0.35 GB</text><text x="427.0" y="282.0" font-size="10.5" fill="#92400e" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" opacity="0.85">176M 参数 · 30%</text><rect x="666.0" y="246.0" width="222.0" height="44.0" fill="#c4b5fd" rx="4" stroke="none" stroke-width="1"/><text x="680.0" y="266.0" font-size="12.5" fill="#5b21b6" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">lm_head  0.31 GB</text><text x="680.0" y="282.0" font-size="10.5" fill="#5b21b6" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" opacity="0.85">156M 参数 · 26%</text><rect x="30.0" y="246.0" width="860.0" height="44.0" fill="none" rx="4" stroke="#cbd5e1" stroke-width="1"/><text x="890.0" y="318.0" font-size="11" fill="#7c3aed" text-anchor="end" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">只为算 bs 行 logits，却读满 311 MB —— 量化第一刀</text><text x="30.0" y="346.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">③ 三个互不重叠的攻击面</text><rect x="30.0" y="360.0" width="276.0" height="138.0" fill="#dbeafe" rx="8" stroke="none" stroke-width="1"/><rect x="30.0" y="360.0" width="4.0" height="138.0" fill="#2563eb" rx="2" stroke="none" stroke-width="1"/><text x="46.0" y="386.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">Q</text><text x="64.0" y="386.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">量化权重</text><text x="292.0" y="386.0" font-size="9.5" fill="#2563eb" text-anchor="end" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" opacity="0.85">砍 ② 整条</text><text x="46.0" y="415.0" font-size="11" fill="#475569" text-anchor="start" font-weight="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif">· int8 全线：1.19 → 0.60 GB</text><text x="46.0" y="436.0" font-size="11" fill="#475569" text-anch